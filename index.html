<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Underworld V3.0 - 文明基石</title>
    <style>
        body { margin: 0; background: #1a1a1a; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; display: flex; color: white; }
        #top-bar { position: absolute; top: 0; left: 0; right: 250px; height: 45px; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 50; border-bottom: 2px solid #ffd700; color: #00ff00; font-weight: bold; font-size: 1.2em; }
        #game-container { position: relative; flex-grow: 1; height: 100vh; background: #222; }
        canvas { display: block; }
        #god-panel { width: 250px; background: #252525; border-left: 2px solid #444; padding: 15px; z-index: 100; box-sizing: border-box; }
        .stat-card { background: #333; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; font-size: 0.9em; }
        button { width: 100%; padding: 12px; margin: 5px 0; cursor: pointer; background: #444; color: white; border: 1px solid #666; transition: 0.2s; border-radius: 5px; font-weight: bold; }
        button:hover { background: #ffd700; color: #000; }
        #status-window { position: absolute; width: 220px; background: rgba(0, 0, 0, 0.9); border: 1px solid #ffd700; padding: 15px; display: none; pointer-events: none; border-radius: 10px; z-index: 1000; }
        .bar { width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden; margin-top: 5px; border: 1px solid #444; }
        .bar-fill { height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="top-bar">世界曆法：<span id="world-time">00:00</span></div>

<div id="game-container">
    <canvas id="worldCanvas"></canvas>
    <div id="status-window">
        <strong id="v-name" style="color: #ffd700;">村民</strong> <span id="v-gender"></span>
        <div id="v-action" style="color: #0f0; font-size: 0.9em; margin: 5px 0;">動作：觀察中</div>
        <hr style="border:0; border-top:1px solid #444;">
        天命 (HP)<div class="bar"><div id="v-health" class="bar-fill" style="background: #ff4d4d;"></div></div>
        飽食 (Food)<div class="bar"><div id="v-hunger" class="bar-fill" style="background: #ffaa00;"></div></div>
        體力 (Energy)<div class="bar"><div id="v-energy" class="bar-fill" style="background: #00aaff;"></div></div>
    </div>
</div>

<div id="god-panel">
    <h2>創世神權限</h2>
    <div class="stat-card">
        存活人口：<span id="pop-count">0</span><br>
        世界資源：<span id="res-count">100</span>
    </div>
    <button onclick="castMiracle('food')">投放聖餐 (+50 食物)</button>
    <button onclick="castMiracle('energy')">神聖加護 (+40 體力)</button>
    <button style="color:#f66; margin-top:20px;" onclick="resetWorld()">重啟世界線</button>
    <p style="font-size: 0.75em; color: #888; margin-top: 15px;">
        * 深綠：森林（食物+木材）<br>
        * 藍色：湖泊（豐富魚類）<br>
        * 淺綠：草地（少量根莖）
    </p>
</div>

<script>
    let villagers = [], environment = [], selectedId = null;
    let totalMinutes = 480; // 從早上 8:00 開始
    const TILE_SIZE = 45;

    window.onload = function() {
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('world-time');
        const statusWindow = document.getElementById('status-window');

        function init() {
            canvas.width = window.innerWidth - 250;
            canvas.height = window.innerHeight;
            environment = [];
            const cols = Math.ceil(canvas.width / TILE_SIZE);
            const rows = Math.ceil(canvas.height / TILE_SIZE);
            for(let x=0; x<cols; x++) {
                for(let y=0; y<rows; y++) {
                    let r = Math.random();
                    let type = (r < 0.08) ? 'water' : (r < 0.22 ? 'forest' : 'grass');
                    environment.push({x: x*TILE_SIZE, y: y*TILE_SIZE, type: type});
                }
            }
            villagers = Array.from({length: 4}, () => new Villager(canvas));
        }

        class Villager {
            constructor(cvs) {
                this.id = Math.random().toString(36).substr(2, 9);
                this.x = Math.random() * cvs.width;
                this.y = Math.random() * cvs.height;
                this.gender = Math.random() > 0.5 ? "男" : "女";
                this.name = (this.gender === "男" ? "亞當" : "夏娃") + "-" + Math.floor(Math.random()*99);
                this.hp = 100; this.hunger = 70; this.energy = 80;
                this.action = "漫步"; this.angle = Math.random()*Math.PI*2;
                this.target = null;
            }

            update() {
                if(this.hp <= 0) return;
                
                // 生理衰減 (稍微放慢速度)
                this.hunger -= 0.008; 
                this.energy -= 0.005;

                // AI 行為決策樹
                if (this.energy < 15) {
                    this.action = "睡眠";
                    this.energy += 0.05;
                } else if (this.hunger < 50) {
                    this.action = "覓食";
                    this.findResources();
                } else {
                    this.action = "漫步";
                    this.moveRandomly();
                }

                // 生命維持檢查
                if (this.hunger <= 0) { this.hunger = 0; this.hp -= 0.02; }
                if (this.energy > 100) this.energy = 100;
            }

            findResources() {
                // 尋找最近的資源點
                let nearby = environment.find(t => 
                    (t.type === 'forest' || t.type === 'water') && 
                    Math.abs(t.x - this.x) < 60 && Math.abs(t.y - this.y) < 60
                );

                if (nearby) {
                    // 採集效果：森林增加少量，湖泊增加較多
                    let gain = nearby.type === 'forest' ? 0.05 : 0.08;
                    this.hunger = Math.min(100, this.hunger + gain);
                    this.action = nearby.type === 'forest' ? "森林採集" : "湖邊捕魚";
                } else {
                    this.moveRandomly(); // 沒找到就繼續走
                }
            }

            moveRandomly() {
                if(Math.random() < 0.03) this.angle += (Math.random()-0.5);
                let spd = this.action === "覓食" ? 0.7 : 0.4;
                this.x += Math.cos(this.angle) * spd;
                this.y += Math.sin(this.angle) * spd;
                // 邊界保護
                if(this.x < 10 || this.x > canvas.width-10) this.angle = Math.PI - this.angle;
                if(this.y < 50 || this.y > canvas.height-10) this.angle = -this.angle;
            }

            draw() {
                if(this.hp <= 0) {
                    ctx.fillStyle = "#555"; ctx.fillRect(this.x-5, this.y-5, 10, 10); // 遺骸
                    return;
                }
                if(selectedId === this.id) {
                    ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 20, 0, Math.PI*2); ctx.stroke();
                }
                // 睡覺變灰，平常依性別顯色
                ctx.fillStyle = this.action === "睡眠" ? "#888" : (this.gender === "男" ? "#4db8ff" : "#ff85a2");
                ctx.beginPath(); ctx.arc(this.x, this.y, 14, 0, Math.PI*2); ctx.fill();
                
                // 狀態小標籤
                if(this.hunger < 30) { ctx.fillStyle = "red"; ctx.font = "bold 14px Arial"; ctx.fillText("🍖", this.x-8, this.y-20); }
                if(this.action === "睡眠") { ctx.fillStyle = "white"; ctx.font = "12px Arial"; ctx.fillText("Zzz", this.x+10, this.y-10); }
            }
        }

        function loop() {
            // 背景與地圖渲染
            ctx.fillStyle = "#2d4a2d"; ctx.fillRect(0,0,canvas.width, canvas.height);
            environment.forEach(t => {
                if(t.type === 'water') ctx.fillStyle = "#2a5a7a";
                else if(t.type === 'forest') ctx.fillStyle = "#1b331b";
                else return;
                ctx.fillRect(t.x, t.y, TILE_SIZE-1, TILE_SIZE-1);
            });

            // 時間系統校正：每 6 幀增加 1 分鐘 (約 10 秒 = 100 分鐘)
            if(totalMinutes % 6 === 0) totalMinutes += 1;
            let h = Math.floor((totalMinutes/60)%24), m = Math.floor(totalMinutes%60);
            timeDisplay.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            
            villagers.forEach(v => { v.update(); v.draw(); });
            document.getElementById('pop-count').innerText = villagers.filter(v=>v.hp>0).length;
            
            if(selectedId) {
                let v = villagers.find(v => v.id === selectedId);
                if(v) {
                    document.getElementById('v-health').style.width = v.hp + '%';
                    document.getElementById('v-hunger').style.width = v.hunger + '%';
                    document.getElementById('v-energy').style.width = v.energy + '%';
                    document.getElementById('v-action').innerText = "動作：" + v.action;
                }
            }
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;
            let found = villagers.find(v => Math.hypot(v.x - mx, v.y - my) < 30 && v.hp > 0);
            if(found) {
                selectedId = found.id;
                document.getElementById('v-name').innerText = found.name;
                document.getElementById('v-gender').innerText = `(${found.gender})`;
                statusWindow.style.display = 'block';
                statusWindow.style.left = (e.clientX + 15) + 'px';
                statusWindow.style.top = (e.clientY + 15) + 'px';
            } else { selectedId = null; statusWindow.style.display = 'none'; }
        });

        window.castMiracle = (t) => {
            if(t==='food') { villagers.forEach(v => v.hunger = Math.min(100, v.hunger+50)); alert("你降下了聖餐！"); }
            if(t==='energy') { villagers.forEach(v => v.energy = Math.min(100, v.energy+40)); alert("你賦予了活力！"); }
        };
        window.resetWorld = () => { if(confirm("確定要重啟世界線？")) { totalMinutes = 480; init(); } };

        init();
        loop();
    };
</script>
</body>
</html>
