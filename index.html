<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Underworld V3.6.1 - 穩定血脈系統</title>
    <style>
        body { margin: 0; background: #1a1a1a; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; display: flex; color: white; }
        #top-bar { position: absolute; top: 0; left: 0; right: 280px; height: 35px; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 50; border-bottom: 2px solid #ffd700; color: #00ff00; font-weight: bold; font-size: 1em; }
        #game-container { position: relative; flex-grow: 1; height: 100vh; background: #000; }
        canvas { display: block; }
        
        #god-panel { width: 280px; background: #252525; border-left: 2px solid #444; padding: 10px; z-index: 100; box-sizing: border-box; display: flex; flex-direction: column; }
        .stat-card { background: #333; padding: 8px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #444; font-size: 0.8em; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 5px; }
        h3 { font-size: 0.8em; margin: 5px 0; color: #ffd700; border-left: 3px solid #ffd700; padding-left: 5px; }
        button { padding: 5px; cursor: pointer; background: #444; color: white; border: 1px solid #666; transition: 0.2s; border-radius: 4px; font-weight: bold; font-size: 0.75em; }
        button:hover { background: #ffd700; color: #000; }
        
        #status-window { margin-top: auto; background: #111; border: 2px solid #ffd700; padding: 10px; display: none; border-radius: 8px; font-size: 0.8em; }
        .family-info { font-size: 0.75em; color: #888; margin: 4px 0; line-height: 1.2; }
        .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.7em; color: #aaa; }
        .bar { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 2px; border: 1px solid #444; }
        .bar-fill { height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="top-bar">世界曆法：<span id="world-time">08:00</span></div>

<div id="game-container"><canvas id="worldCanvas"></canvas></div>

<div id="god-panel">
    <h3>管理中心</h3>
    <div class="stat-card">人口：<span id="pop-count">0</span> | 物資：<span id="res-count">100</span></div>
    
    <h3>神蹟/災厄</h3>
    <div class="btn-group">
        <button onclick="castMiracle('food')">投放聖餐</button>
        <button onclick="castMiracle('energy')">神聖加護</button>
        <button style="color:#ff8;" onclick="castCalamity('disease')">疫病降臨</button>
        <button style="color:#f66;" onclick="resetWorld()">重啟世界</button>
    </div>

    <div id="status-window">
        <div style="display: flex; justify-content: space-between;">
            <strong id="v-name" style="color: #ffd700;">村民</strong>
            <span id="v-age" style="color: #00ff00;"></span>
        </div>
        <div class="family-info">
            父：<span id="v-father"></span> | 母：<span id="v-mother"></span><br>
            性格：<span id="v-personality"></span>
        </div>
        <div id="v-action" style="color: #0f0; font-size: 0.85em; margin-bottom: 5px;">動作：載入中</div>
        <div class="attr-grid">
            <span>STR: <b id="attr-str"></b></span> <span>CON: <b id="attr-con"></b></span>
            <span>SIZ: <b id="attr-siz"></b></span> <span>DEX: <b id="attr-dex"></b></span>
        </div>
        <hr style="border:0; border-top:1px solid #444; margin: 6px 0;">
        HP<div class="bar"><div id="v-health" class="bar-fill" style="background: #ff4d4d;"></div></div>
        飽食<div class="bar"><div id="v-hunger" class="bar-fill" style="background: #ffaa00;"></div></div>
        體力<div class="bar"><div id="v-energy" class="bar-fill" style="background: #00aaff;"></div></div>
    </div>
</div>

<script>
    let villagers = [], environment = [], selectedId = null, totalMinutes = 480, globalRes = 100;
    let fogGrid = [];
    let genCounters = {};
    const TILE_SIZE = 40;

    window.onload = function() {
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('world-time');
        const statusWindow = document.getElementById('status-window');

        function getNextSerial(gen, gender) {
            if (!genCounters[gen]) genCounters[gen] = { male: 1, female: 2 };
            let val = (gender === "男") ? genCounters[gen].male : genCounters[gen].female;
            if (gender === "男") genCounters[gen].male += 2;
            else genCounters[gen].female += 2;
            return val.toString().padStart(2, '0');
        }

        function init() {
            villagers = []; environment = []; fogGrid = []; selectedId = null; 
            totalMinutes = 480; globalRes = 100; genCounters = {};
            statusWindow.style.display = 'none';

            canvas.width = window.innerWidth - 280;
            canvas.height = window.innerHeight;
            
            const cols = Math.ceil(canvas.width / TILE_SIZE);
            const rows = Math.ceil(canvas.height / TILE_SIZE);
            for(let x=0; x<cols; x++) {
                fogGrid[x] = [];
                for(let y=0; y<rows; y++) {
                    let r = Math.random();
                    environment.push({x: x*TILE_SIZE, y: y*TILE_SIZE, type: (r < 0.08) ? 'water' : (r < 0.22 ? 'forest' : 'grass')});
                    fogGrid[x][y] = true;
                }
            }

            for(let i=0; i<4; i++) {
                let gender = (i < 2) ? "男" : "女";
                villagers.push(new Villager(canvas, 1, gender));
            }
        }

        class Villager {
            constructor(cvs, gen, gender, isBaby = false, x = null, y = null, fName = "無", mName = "無", fId = null, mId = null) {
                this.id = Math.random().toString(36).substr(2, 9);
                this.gen = gen;
                this.gender = gender;
                this.serial = getNextSerial(this.gen, this.gender);
                this.name = `${this.gen}-${this.serial}`;
                this.x = x || cvs.width/2 + (Math.random()-0.5)*100;
                this.y = y || cvs.height/2 + (Math.random()-0.5)*100;
                this.fatherName = fName; this.motherName = mName;
                this.fatherId = fId; this.motherId = mId;
                
                this.str = 3 + Math.floor(Math.random() * 15);
                this.con = 3 + Math.
