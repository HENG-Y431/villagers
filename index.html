<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Underworld V3.8 - 穩定版</title>
    <style>
        body { margin: 0; background: #1a1a1a; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; display: flex; color: white; }
        #top-bar { position: absolute; top: 0; left: 0; right: 280px; height: 35px; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 50; border-bottom: 2px solid #ffd700; color: #00ff00; font-weight: bold; }
        #game-container { position: relative; flex-grow: 1; height: 100vh; background: #222; }
        canvas { display: block; }
        #god-panel { width: 280px; background: #252525; border-left: 2px solid #444; padding: 10px; z-index: 100; box-sizing: border-box; display: flex; flex-direction: column; }
        .stat-card { background: #333; padding: 8px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #444; font-size: 0.8em; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 5px; }
        button { padding: 5px; cursor: pointer; background: #444; color: white; border: 1px solid #666; transition: 0.2s; border-radius: 4px; font-weight: bold; font-size: 0.75em; }
        button:hover { background: #ffd700; color: #000; }
        #status-window { margin-top: auto; background: #111; border: 2px solid #ffd700; padding: 10px; display: none; border-radius: 8px; font-size: 0.8em; }
        .family-info { font-size: 0.75em; color: #888; margin: 4px 0; }
        .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.7em; color: #aaa; }
        .bar { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 2px; }
        .bar-fill { height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="top-bar">世界曆法：<span id="world-time">00:00</span></div>
<div id="game-container"><canvas id="worldCanvas"></canvas></div>

<div id="god-panel">
    <h3>管理中心</h3>
    <div class="stat-card">人口：<span id="pop-count">0</span> | 物資：<span id="res-count">100</span></div>
    <h3>神蹟/災厄</h3>
    <div class="btn-group">
        <button onclick="castMiracle('food')">投放聖餐</button>
        <button onclick="castMiracle('energy')">神聖加護</button>
        <button style="color:#ff8;" onclick="castCalamity('disease')">疫病降臨</button>
        <button style="color:#f66;" onclick="resetWorld()">重啟世界</button>
    </div>

    <div id="status-window">
        <div style="display: flex; justify-content: space-between;">
            <strong id="v-name" style="color: #ffd700;">編號</strong>
            <span id="v-age" style="color: #00ff00;">0 歲</span>
        </div>
        <div class="family-info">父：<span id="v-father"></span> | 母：<span id="v-mother"></span></div>
        <div id="v-action" style="color: #0f0; font-size: 0.8em; margin-bottom: 5px;">動作：漫步</div>
        <div class="attr-grid">
            <span>STR: <b id="attr-str"></b></span> <span>CON: <b id="attr-con"></b></span>
            <span>SIZ: <b id="attr-siz"></b></span> <span>DEX: <b id="attr-dex"></b></span>
        </div>
        <hr style="border:0; border-top:1px solid #444; margin: 6px 0;">
        HP<div class="bar"><div id="v-health" class="bar-fill" style="background: #ff4d4d;"></div></div>
        飽食<div class="bar"><div id="v-hunger" class="bar-fill" style="background: #ffaa00;"></div></div>
        體力<div class="bar"><div id="v-energy" class="bar-fill" style="background: #00aaff;"></div></div>
    </div>
</div>

<script>
    let villagers = [], environment = [], selectedId = null, totalMinutes = 480, globalRes = 100, genCounters = {};
    const TILE_SIZE = 45;

    window.onload = function() {
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('world-time');
        const statusWindow = document.getElementById('status-window');

        function getSerial(gen, gender) {
            if (!genCounters[gen]) genCounters[gen] = { m: 1, f: 2 };
            let s = (gender === "男") ? genCounters[gen].m : genCounters[gen].f;
            if (gender === "男") genCounters[gen].m += 2; else genCounters[gen].f += 2;
            return s.toString().padStart(2, '0');
        }

        function init() {
            villagers = []; environment = []; genCounters = {}; selectedId = null; totalMinutes = 480;
            canvas.width = window.innerWidth - 280; canvas.height = window.innerHeight;
            const cols = Math.ceil(canvas.width / TILE_SIZE), rows = Math.ceil(canvas.height / TILE_SIZE);
            for(let x=0; x<cols; x++) {
                for(let y=0; y<rows; y++) {
                    let r = Math.random();
                    environment.push({x: x*TILE_SIZE, y: y*TILE_SIZE, type: (r < 0.08) ? 'water' : (r < 0.22 ? 'forest' : 'grass')});
                }
            }
            for(let i=0; i<4; i++) { villagers.push(new Villager(canvas, 1, (i < 2 ? "男" : "女"))); }
        }

        class Villager {
            constructor(cvs, gen, gender, isBaby = false, x = null, y = null, fName = "無", mName = "無", fId = null, mId = null) {
                this.id = Math.random().toString(36).substr(2, 9);
                this.gen = gen; this.gender = gender; this.serial = getSerial(gen, gender);
                this.name = `${this.gen}-${this.serial}`;
                this.x = x || cvs.width/2 + (Math.random()-0.5)*150;
                this.y = y || cvs.height/2 + (Math.random()-0.5)*150;
                this.fatherName = fName; this.motherName = mName; this.fatherId = fId; this.motherId = mId;
                this.str = 3 + Math.floor(Math.random()*15); this.con = 3 + Math.floor(Math.random()*15);
                this.siz = 8 + Math.floor(Math.random()*10); this.dex = 3 + Math.floor(Math.random()*15);
                this.age = isBaby ? 0 : 20; this.hp = Math.ceil((this.con+this.siz)/2); this.maxHp = this.hp;
                this.hunger = 80; this.energy = 80; this.mateCooldown = 0; this.action = "漫步"; this.angle = Math.random()*Math.PI*2;
            }
            update() {
                if(this.hp <= 0) return;
                this.age += 0.0005; this.hunger -= 0.008; this.energy -= 0.008;
                if(this.mateCooldown > 0) this.mateCooldown--;
                if(this.age > 80 && Math.random() < 0.001) this.hp = 0; // 老化致死
                if(this.energy < 15) { this.action = "睡眠"; this.energy += 0.08; }
                else if(this.hunger < 50) { this.action = "採集"; this.move(0.7); this.findRes(); }
                else {
                    if(this.age < 12) {
                        let p = villagers.find(v => v.id === this.fatherId || v.id === this.motherId);
                        if(p && p.hp > 0) { this.action = "跟隨"; this.angle = Math.atan2(p.y-this.y, p.x-this.x); this.move(0.4); }
                        else this.move(0.3);
                    } else { this.action = "探索"; this.move(0.5); this.checkSocial(); }
                }
                if(this.hunger <= 0) this.hp -= 0.05;
            }
            findRes() {
                let nearby = environment.find(t => (t.type !== 'grass') && Math.abs(t.x-this.x)<30 && Math.abs(t.y-this.y)<30);
                if(nearby) { this.hunger = Math.min(100, this.hunger + (this.str/60)); this.action = "進食"; }
            }
            move(spd) {
                if(Math.random()<0.02) this.angle += (Math.random()-0.5);
                this.x += Math.cos(this.angle)*spd; this.y += Math.sin(this.angle)*spd;
                if(this.x < 15 || this.x > canvas.width-15) this.angle = Math.PI - this.angle;
                if(this.y < 50 || this.y > canvas.height-15) this.angle = -this.angle;
            }
            checkSocial() {
                villagers.forEach(o => {
                    if(o === this || o.hp <= 0 || this.age < 18 || o.age < 18) return;
                    if(Math.hypot(this.x-o.x, this.y-o.y) < 25 && this.gender !== o.gender && this.mateCooldown <= 0 && o.mateCooldown <= 0 && this.hunger > 75) {
                        this.mateCooldown = 6000; o.mateCooldown = 6000;
                        let baby = new Villager(canvas, Math.max(this.gen, o.gen)+1, (Math.random()>0.5?"男":"女"), true, this.x, this.y, (this.gender==="男"?this.name:o.name), (this.gender==="女"?this.name:o.name), (this.gender==="男"?this.id:o.id), (this.gender==="女"?this.id:o.id));
                        villagers.push(baby);
                    }
                });
            }
            draw() {
                if(this.hp <= 0) { ctx.fillStyle="#333"; ctx.fillRect(this.x-5,this.y-5,10,10); return; }
                let size = (this.age < 18) ? 6 : (10 + this.siz/2);
                if(selectedId === this.id) { ctx.strokeStyle="#ffd700"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(this.x,this.y,size+5,0,Math.PI*2); ctx.stroke(); }
                ctx.fillStyle = (this.action === "睡眠") ? "#666" : (this.gender === "男" ? "#4db8ff" : "#ff85a2");
                ctx.beginPath(); ctx.arc(this.x,this.y,size,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.font = "10px Arial"; ctx.fillText(this.name, this.x-10, this.y-size-5);
            }
        }

        function loop() {
            ctx.fillStyle = "#2d4a2d"; ctx.fillRect(0,0,canvas.width, canvas.height);
            environment.forEach(t => {
                ctx.fillStyle = (t.type === 'water') ? "#2a5a7a" : (t.type === 'forest' ? "#1b331b" : "#2d4a2d");
                ctx.fillRect(t.x, t.y, TILE_SIZE-1, TILE
