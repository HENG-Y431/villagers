<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>V1.2 Village Sandbox (ESM)</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <canvas id="c" width="1200" height="800"></canvas>

    <aside class="side">
      <header class="topbar">
        <div class="pill" id="timePill">Year 0 • Day 0</div>
        <div class="pill" id="popPill">Pop 0</div>
        <div class="pill">Speed <span id="speedText">1x</span></div>
      </header>

      <main class="panel">
        <section class="card">
          <div class="row">
            <div>
              <div class="title">God Panel</div>
              <div class="muted">ES Modules + 拆檔</div>
            </div>
            <button id="spawnBtn">+ Spawn</button>
          </div>

          <div class="controls">
            <button id="mealBtn">投放聖餐</button>
            <button id="healBtn">神聖治癒</button>

            <label class="muted inline">
              Seed <input id="seedInput" value="12345" />
            </label>
            <button id="resetBtn">重啟文明</button>
          </div>

          <div class="controls">
            <button id="slowerBtn">-</button>
            <button id="fasterBtn">+</button>
            <div class="muted">用本機 server 跑（VS Code Live Server 最方便）</div>
          </div>
        </section>

        <section class="card">
          <div class="title">Villagers</div>
          <div class="list" id="villagerList"></div>
        </section>

        <section class="card" id="selectedCard" style="display:none;"></section>

        <section class="card">
          <div class="row">
            <div class="title">Chronicle</div>
            <div class="muted" id="logCount">0</div>
          </div>
          <div class="log" id="log"></div>
        </section>
      </main>
    </aside>
  </div>

  <!-- 入口：ES Module -->
  <script type="module" src="./script.js"></script>
</body>
</html>
