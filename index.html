<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Underworld V4.1 - 社會契約</title>
    <style>
        body { margin: 0; background: #121212; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; display: flex; color: #e0e0e0; }
        #top-bar { position: absolute; top: 0; left: 0; right: 280px; height: 35px; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 50; border-bottom: 2px solid #daa520; color: #00ff00; font-weight: bold; font-size: 0.9em; }
        #game-container { position: relative; flex-grow: 1; height: 100vh; background: #1a1a1a; }
        canvas { display: block; }
        #god-panel { width: 280px; background: #1e1e1e; border-left: 2px solid #333; padding: 12px; z-index: 100; box-sizing: border-box; display: flex; flex-direction: column; }
        .stat-card { background: #2d2d2d; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #444; font-size: 0.8em; }
        h3 { font-size: 0.85em; margin: 5px 0; color: #daa520; border-left: 3px solid #daa520; padding-left: 5px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        button { padding: 6px 2px; cursor: pointer; background: #3d3d3d; color: white; border: 1px solid #555; transition: 0.2s; border-radius: 4px; font-weight: bold; font-size: 0.75em; }
        button:hover { background: #daa520; color: #000; }
        #status-window { margin-top: auto; background: #000; border: 1px solid #daa520; padding: 12px; display: none; border-radius: 8px; font-size: 0.85em; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .social-info { font-size: 0.7em; color: #88c; margin: 4px 0; border-top: 1px solid #333; padding-top: 4px; }
        .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.7em; color: #aaa; margin-top: 5px; }
        .bar { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 2px; border: 1px solid #333; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="top-bar">世界曆法：<span id="world-time">08:00</span></div>

<div id="game-container"><canvas id="worldCanvas"></canvas></div>

<div id="god-panel">
    <h3>文明狀態</h3>
    <div class="stat-card">人口：<span id="pop-count">0</span> | 物資：<span id="res-count">100</span></div>
    
    <h3>管理指令</h3>
    <div class="btn-grid">
        <button onclick="castMiracle('food')">投放聖餐</button>
        <button onclick="castMiracle('energy')">賦予精神</button>
        <button onclick="castCalamity('disease')" style="color:#ff6b6b;">災厄:疫病</button>
        <button onclick="resetWorld()" style="color:#aaa;">重啟世界</button>
    </div>

    <div id="status-window">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong id="v-name" style="color: #daa520; font-size: 1.1em;">1-01</strong>
            <span id="v-age" style="color: #4caf50;">0 歲</span>
        </div>
        <div id="v-personality" style="color: #00ff00; font-size: 0.75em; font-weight: bold;">個性：載入中</div>
        <div class="social-info" id="v-social">關係：無</div>
        
        <div class="attr-grid">
            <span>STR: <b id="attr-str"></b></span> <span>CON: <b id="attr-con"></b></span>
            <span>SIZ: <b id="attr-siz"></b></span> <span>DEX: <b id="attr-dex"></b></span>
        </div>
        <hr style="border:0; border-top:1px solid #444; margin: 8px 0;">
        HP<div class="bar"><div id="v-health" class="bar-fill" style="background: #e74c3c;"></div></div>
        飽食<div class="bar"><div id="v-hunger" class="bar-fill" style="background: #f39c12;"></div></div>
    </div>
</div>

<script>
    let villagers = [], environment = [], selectedId = null, totalMinutes = 480, globalRes = 100, genCounters = {};
    const TILE_SIZE = 45;

    window.onload = function() {
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('world-time');
        const statusWindow = document.getElementById('status-window');

        function getSerial(gen, gender) {
            if (!genCounters[gen]) genCounters[gen] = { m: 1, f: 2 };
            let s = (gender === "男") ? genCounters[gen].m : genCounters[gen].f;
            if (gender === "男") genCounters[gen].m += 2; else genCounters[gen].f += 2;
            return s.toString().padStart(2, '0');
        }

        function init() {
            villagers = []; environment = []; genCounters = {}; selectedId = null; totalMinutes = 480;
            canvas.width = window.innerWidth - 280; canvas.height = window.innerHeight;
            const cols = Math.ceil(canvas.width / TILE_SIZE), rows = Math.ceil(canvas.height / TILE_SIZE);
            for(let x=0; x<cols; x++) {
                for(let y=0; y<rows; y++) {
                    let r = Math.random();
                    environment.push({x: x*TILE_SIZE, y: y*TILE_SIZE, type: (r < 0.08 ? 'water' : (r < 0.22 ? 'forest' : 'grass'))});
                }
            }
            for(let i=0; i<4; i++) { villagers.push(new Villager(canvas, 1, (i < 2 ? "男" : "女"))); }
        }

        class Villager {
            constructor(cvs, gen, gender, isBaby = false, x = null, y = null, fName = "無", mName = "無") {
                this.id = Math.random().toString(36).substr(2, 9);
                this.gen = gen; this.gender = gender; this.serial = getSerial(gen, gender);
                this.name = `${this.gen}-${this.serial}`;
                this.x = x || cvs.width/2 + (Math.random()-0.5)*200;
                this.y = y || cvs.height/2 + (Math.random()-0.5)*200;
                this.father = fName; this.mother = mName;
                
                this.str = 3 + Math.floor(Math.random()*16); 
                this.con = 3 + Math.floor(Math.random()*16);
                this.siz = 8 + Math.floor(Math.random()*11); 
                this.dex = 3 + Math.floor(Math.random()*16);
                
                // 個性判定邏輯
                if (this.str + this.dex > 25) this.personality = "積極";
                else if (this.siz > 15 && this.con < 10) this.personality = "懶惰";
                else if (this.siz < 10 && this.dex > 12) this.personality = "膽小";
                else this.personality = "普通";

                this.age = isBaby ? 0 : 20; 
                this.maxHp = Math.ceil((this.con + this.siz) / 2);
                this.hp = this.maxHp; this.hunger = 80; this.energy = 80;
                this.action = "漫步"; this.angle = Math.random()*Math.PI*2;
                this.mateCooldown = 0;
                this.relationships = {}; // { villagerId: { score: 0, type: 'Stranger' } }
            }

            update() {
                if(this.hp <= 0) return;
                this.age += 0.0004; this.hunger -= 0.008; this.energy -= 0.008;
                if(this.mateCooldown > 0) this.mateCooldown--;

                if(this.energy < 15) { this.action = "睡眠"; this.energy += 0.08; }
                else if(this.hunger < 50) { this.action = "採集"; this.move(0.7); this.findRes(); }
                else {
                    this.action = "探索中";
                    this.move(this.personality === "積極" ? 0.6 : 0.45);
                    this.socialCycle();
                }
                if(this.hunger <= 0) this.hp -= 0.03;
                if(this.age > 85) this.hp -= 0.05; 
            }

            socialCycle() {
                villagers.forEach(other => {
                    if(other === this || other.hp <= 0) return;
                    let dist = Math.hypot(this.x - other.x, this.y - other.y);
                    if(dist < 40) {
                        this.interact(other);
                    }
                });
            }

            interact(other) {
                if(!this.relationships[other.id]) this.relationships[other.id] = { score: 0, type: '陌生人' };
                this.relationships[other.id].score += 0.05;
                
                let rel = this.relationships[other.id];
                // 師生關係 (長輩與晚輩)
                if(this.age > 40 && other.age < 18) rel.type = '師生';
                // 朋友關係
                else if(rel.score > 10) {
                    if(this.gender !== other.gender && this.age >= 18 && other.age >= 18) {
                        rel.type = '戀人';
                        this.reproduce(other);
                    } else {
                        rel.type = '朋友';
                    }
                }
            }

            reproduce(other) {
                if(this.mateCooldown <= 0 && other.mateCooldown <= 0 && this.hunger > 70) {
                    this.mateCooldown = 5000; other.mateCooldown = 5000;
                    let baby = new Villager(canvas, Math.max(this.gen, other.gen)+1, (Math.random()>0.5?"男":"女"), true, this.x, this.y, (this.gender==="男"?this.name:other.name), (this.gender==="女"?this.name:other.name));
                    villagers.push(baby);
                }
            }

            findRes() {
                let nearby = environment.find(t => (t.type !== 'grass') && Math.abs(t.x-this.x)<30 && Math.abs(t.y-this.y)<30);
                if(nearby) { this.hunger = Math.min(100, this.hunger + (this.str/65)); this.action = "進食"; }
            }

            move(spd) {
                if(Math.random()<0.02) this.angle += (Math.random()-0.5);
                this.x += Math.cos(this.angle)*spd; this.y += Math.sin(this.angle)*spd;
                if(this.x < 15 || this.x > canvas.width-15) this.angle = Math.PI - this.angle;
                if(this.y < 50 || this.y > canvas.height-15) this.angle = -this.angle;
            }

            draw() {
                if(this.hp <= 0) { ctx.fillStyle="#444"; ctx.fillRect(this.x-6,this.y-6,12,12); return; }
                let r = (this.age < 18) ? 6 : (10 + this.siz/2.5);
                if(selectedId === this.id) { ctx.strokeStyle="#daa520"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(this.x,this.y,r+7,0,Math.PI*2); ctx.stroke(); }
                ctx.fillStyle = (this.action === "睡眠") ? "#666" : (this.gender === "男" ? "#3498db" : "#e84393");
                ctx.beginPath(); ctx.arc(this.x,this.y,r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.font = "10px Arial"; ctx.fillText(this.name, this.x-10, this.y-r-5);
                if(this.action === "社交中") { ctx.fillText("💬", this.x-5, this.y-r-15); }
            }
        }

        function loop() {
            ctx.fillStyle = "#1e301e"; ctx.fillRect(0,0,canvas.width, canvas.height);
            environment.forEach(t => {
                ctx.fillStyle = (t.type === 'water' ? "#2a5a7a" : (t.type === 'forest' ? "#145a32" : "#2d4a2d"));
                ctx.fillRect(t.x, t.y, TILE_SIZE-1, TILE_SIZE-1);
            });
            totalMinutes += 0.05;
            timeDisplay.innerText = `${Math.floor((totalMinutes/60)%24).toString().padStart(2,'0')}:${Math.floor(totalMinutes%60).toString().padStart(2,'0')}`;
            villagers.forEach(v => { v.update(); v.draw(); });
            document.getElementById('pop-count').innerText = villagers.filter(v=>v.hp>0).length;
            if(selectedId) {
                let v = villagers.find(v => v.id === selectedId);
                if(v) {
                    document.getElementById('v-age').innerText = Math.floor(v.age) + " 歲";
                    document.getElementById('v-personality').innerText = "個性：" + v.personality;
                    document.getElementById('v-health').style.width = (v.hp/v.maxHp*100)+'%';
                    document.getElementById('v-hunger').style.width = v.hunger+'%';
                    document.getElementById('attr-str').innerText = v.str; document.getElementById('attr-con').innerText = v.con;
                    document.getElementById('attr-siz').innerText = v.siz; document.getElementById('attr-dex').innerText = v.dex;
                    let rels = Object.values(v.relationships).map(r => r.type).filter(t => t !== '陌生人');
                    document.getElementById('v-social').innerText = "關係：" + (rels.length > 0 ? Array.from(new Set(rels)).join(', ') : '暫無');
                }
            }
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            let found = villagers.find(v => Math.hypot(v.x-(e.clientX-rect.left), v.y-(e.clientY-rect.top)) < 30 && v.hp > 0);
            if(found) { selectedId = found.id; document.getElementById('v-name').innerText = found.name; statusWindow.style.display = 'block'; }
            else { selectedId = null; statusWindow.style.display = 'none'; }
        });

        window.castMiracle = (t) => villagers.forEach(v => { if(t==='food') v.hunger=100; else v.energy=100; });
        window.castCalamity = (t) => villagers.forEach(v => { if(Math.random()<0.4) v.hp -= 20; });
        window.resetWorld = () => { if(confirm("確定重啟文明？")) init(); };
        init(); loop();
    };
</script>
</body>
</html>
