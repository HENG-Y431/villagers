<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Underworld V5.0 - 天罰與祭壇版</title>
    <style>
        body { margin: 0; background: #121212; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; display: flex; color: #e0e0e0; }
        #top-bar { position: absolute; top: 0; left: 0; right: 280px; height: 35px; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 50; border-bottom: 2px solid #daa520; color: #00ff00; font-weight: bold; font-size: 0.9em; }
        #game-container { position: relative; flex-grow: 1; height: 100vh; background: #1a1a1a; }
        canvas { display: block; }

        /* 底部快捷選取列 */
        #bottom-bar { 
            position: absolute; bottom: 0; left: 0; right: 280px; height: 65px; 
            background: rgba(20, 20, 20, 0.95); border-top: 1px solid #444;
            display: flex; align-items: center; padding: 0 15px; gap: 10px;
            overflow-x: auto; z-index: 60; box-sizing: border-box;
            scrollbar-width: thin; scrollbar-color: #daa520 #222;
        }
        .v-btn { 
            padding: 6px 12px; background: #333; border: 1px solid #555; 
            border-radius: 4px; color: #fff; cursor: pointer; white-space: nowrap; 
            font-size: 0.8em; font-weight: bold; transition: 0.2s; flex-shrink: 0;
        }
        .v-btn:hover { background: #daa520; color: #000; }
        .v-btn.selected { border-color: #daa520; background: #4a4a4a; box-shadow: 0 0 5px #daa520; }
        .v-btn.male { border-left: 3px solid #3498db; }
        .v-btn.female { border-left: 3px solid #e84393; }

        #god-panel { width: 280px; background: #1e1e1e; border-left: 2px solid #333; padding: 12px; z-index: 100; box-sizing: border-box; display: flex; flex-direction: column; }
        .stat-card { background: #2d2d2d; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #444; font-size: 0.85em; color: #ffd700; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; }
        button { padding: 6px 2px; cursor: pointer; background: #3d3d3d; color: white; border: 1px solid #555; transition: 0.2s; border-radius: 4px; font-weight: bold; font-size: 0.75em; }
        button:hover { background: #daa520; color: #000; }
        button.punish { color: #ff4d4d; border-color: #800; }
        button.punish:hover { background: #800; color: #fff; }
        
        #status-window { margin-top: auto; background: #000; border: 1px solid #daa520; padding: 12px; display: none; border-radius: 8px; font-size: 0.85em; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .family-line { font-size: 0.75em; color: #888; border-bottom: 1px solid #333; padding-bottom: 4px; margin-bottom: 4px; }
        .relation-tag { color: #88c; font-size: 0.75em; margin: 4px 0; max-height: 80px; overflow-y: auto; line-height: 1.4; border-top: 1px solid #333; padding-top: 4px; }
        .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.7em; color: #aaa; }
        .bar-wrap { margin-top: 6px; }
        .label { font-size: 0.7em; color: #999; display: flex; justify-content: space-between; }
        .bar { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 2px; border: 1px solid #333; }
        .bar-fill { height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="top-bar">世界時間：<span id="world-time">載入中...</span></div>

<div id="game-container">
    <canvas id="worldCanvas"></canvas>
    <div id="bottom-bar"></div>
</div>

<div id="god-panel">
    <h3>部落人口普查</h3>
    <div class="stat-card">
        <div id="pop-stats">人口：0 (男: 0 | 女: 0)</div>
        <div id="death-stats" style="color: #ff4d4d; margin-top: 5px;">累積死亡：0</div>
    </div>
    
    <h3>神權干預</h3>
    <div class="btn-grid">
        <button onclick="castMiracle('food')">投放聖餐</button>
        <button onclick="castMiracle('energy')">賦予精神</button>
        <button class="punish" onclick="castPlague()">天罰災厄</button>
        <button onclick="resetWorld()" style="color:#aaa;">重啟世界</button>
    </div>

    <div id="status-window">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong id="v-name" style="color: #daa520; font-size: 1.1em;">編號</strong>
            <span id="v-age" style="color: #4caf50;">0 歲</span>
        </div>
        <div id="v-personality" style="color: #00ff00; font-size: 0.8em; font-weight: bold; margin: 2px 0;">性格：載入中</div>
        <div class="family-line">父：<span id="v-father">無</span> | 母：<span id="v-mother">無</span></div>
        <div class="relation-tag" id="v-social">關係：暫無</div>
        
        <div class="attr-grid">
            <span>STR: <b id="attr-str"></b></span> <span>CON: <b id="attr-con"></b></span>
            <span>SIZ: <b id="attr-siz"></b></span> <span>DEX: <b id="attr-dex"></b></span>
        </div>

        <div class="bar-wrap">
            <div class="label"><span>天命 (HP)</span><span id="hp-txt">100%</span></div>
            <div class="bar"><div id="v-health" class="bar-fill" style="background: #e74c3c;"></div></div>
        </div>
        <div class="bar-wrap">
            <div class="label"><span>飽食 (Food)</span><span id="fd-txt">100%</span></div>
            <div class="bar"><div id="v-hunger" class="bar-fill" style="background: #f39c12;"></div></div>
        </div>
    </div>
</div>

<script>
    let villagers = [], environment = [], selectedId = null, totalMinutes = 0, genCounters = {};
    let deathCount = 0;
    let plagueZone = null; // {x, y, r, timer}
    const TILE_SIZE = 45;
    const SOCIAL_RANGE = 80;

    window.onload = function() {
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('world-time');
        const bottomBar = document.getElementById('bottom-bar');
        const statusWindow = document.getElementById('status-window');
        const popStatsDisplay = document.getElementById('pop-stats');
        const deathStatsDisplay = document.getElementById('death-stats');

        function getSerial(gen, gender) {
            if (!genCounters[gen]) genCounters[gen] = { m: 1, f: 2 };
            let s = (gender === "男") ? genCounters[gen].m : genCounters[gen].f;
            if (gender === "男") genCounters[gen].male = (genCounters[gen].m += 2);
            else genCounters[gen].female = (genCounters[gen].f += 2);
            return s.toString().padStart(2, '0');
        }

        function init() {
            villagers = []; environment = []; genCounters = {}; selectedId = null; totalMinutes = 0; deathCount = 0; plagueZone = null;
            canvas.width = window.innerWidth - 280; canvas.height = window.innerHeight;
            const cols = Math.ceil(canvas.width / TILE_SIZE), rows = Math.ceil(canvas.height / TILE_SIZE);
            for(let x=0; x<cols; x++) {
                for(let y=0; y<rows; y++) {
                    let r = Math.random();
                    environment.push({x: x*TILE_SIZE, y: y*TILE_SIZE, type: (r < 0.08 ? 'water' : (r < 0.22 ? 'forest' : 'grass'))});
                }
            }
            for(let i=0; i<4; i++) { villagers.push(new Villager(canvas, 1, (i < 2 ? "男" : "女"))); }
            syncBottomBar();
        }

        class Villager {
            constructor(cvs, gen, gender, isBaby = false, x = null, y = null, fName = "無", mName = "無", fId = null, mId = null) {
                this.id = Math.random().toString(36).substr(2, 9);
                this.gen = gen; this.gender = gender; this.serial = getSerial(gen, gender);
                this.name = `${this.gen}-${this.serial}`;
                this.x = x || cvs.width/2 + (Math.random()-0.5)*200;
                this.y = y || cvs.height/2 + (Math.random()-0.5)*200;
                this.father = fName; this.mother = mName;
                this.fatherId = fId; this.motherId = mId;
                this.str = 3 + Math.floor(Math.random()*16); this.con = 3 + Math.floor(Math.random()*16);
                this.siz = 8 + Math.floor(Math.random()*11); this.dex = 3 + Math.floor(Math.random()*16);
                this.personality = (this.str + this.dex > 25) ? "積極" : (this.con < 10 ? "懶惰" : "普通");
                this.age = isBaby ? 0 : 20; 
                this.maxHp = Math.ceil((this.con + this.siz) / 2);
                this.hp = this.maxHp; this.hunger = 80; this.energy = 80;
                this.action = "漫步"; this.angle = Math.random()*Math.PI*2;
                this.mateCooldown = 0;
                this.rels = {}; 
                this.lastPlagueDamage = 0; // 防止每一幀都扣血，改為特定頻率

                if(fId) this.rels[fId] = { score: 100, type: '父親', name: fName };
                if(mId) this.rels[mId] = { score: 100, type: '母親', name: mName };
            }

            update() {
                if(this.hp <= 0) return;
                this.age += 0.0004; this.hunger -= 0.008; this.energy -= 0.008;
                if(this.mateCooldown > 0) this.mateCooldown--;

                // 天罰偵測
                if (plagueZone) {
                    let dist = Math.hypot(this.x - plagueZone.x, this.y - plagueZone.y);
                    if (dist < plagueZone.r) {
                        let now = Date.now();
                        if (now - this.lastPlagueDamage > 1000) { // 每秒扣一次 15%
                            this.hp -= this.maxHp * 0.15;
                            this.lastPlagueDamage = now;
                        }
                    }
                }

                if(this.energy < 15) { this.action = "睡眠"; this.energy += 0.08; }
                else if(this.hunger < 70 || (this.action === "進食" && this.hunger < 95)) { 
                    this.action = "進食"; this.move(0.75); this.findRes(); 
                } else {
                    if(this.age < 12) {
                        let parent = villagers.find(v => v.id === this.motherId && v.hp > 0) || villagers.find(v => v.id === this.fatherId && v.hp > 0);
                        if(parent) { this.action = "跟隨父母"; this.angle = Math.atan2(parent.y-this.y, parent.x-this.x); this.move(0.45); }
                        else { this.move(0.3); }
                    } else {
                        this.action = "探索";
                        this.move(this.personality === "積極" ? 0.6 : 0.4);
                        this.socialCycle();
                    }
                }
                if(this.hunger <= 0) this.hp -= 0.04;
                if(this.age > 85) this.hp = 0; 
                
                // 處理死亡
                if(this.hp <= 0) {
                    this.hp = 0;
                    deathCount++;
                    syncBottomBar();
                }
            }

            socialCycle() {
                villagers.forEach(o => {
                    if(o === this || o.hp <= 0) return;
                    let d = Math.hypot(this.x - o.x, this.y - o.y);
                    if(d < SOCIAL_RANGE) {
                        if(!this.rels[o.id]) this.rels[o.id] = { score: 0, type: '陌生人', name: o.name };
                        if(!o.rels[this.id]) o.rels[this.id] = { score: 0, type: '陌生人', name: this.name };
                        this.rels[o.id].score += 0.2; o.rels[this.id].score += 0.2;
                        let r = this.rels[o.id];
                        if(this.age > 40 && o.age < 18) r.type = '師生';
                        else if(r.score > 20) { 
                            if(this.gender !== o.gender && this.age >= 18 && o.age >= 18) {
                                r.type = '戀人';
                                if(this.mateCooldown <= 0 && o.mateCooldown <= 0 && this.hunger > 65) this.reproduce(o);
                            } else { r.type = '朋友'; }
                        }
                    }
                });
            }

            reproduce(o) {
                this.mateCooldown = 5000; o.mateCooldown = 5000;
                let baby = new Villager(canvas, Math.max(this.gen, o.gen)+1, (Math.random()>0.5?"男":"女"), true, this.x, this.y, (this.gender==="男"?this.name:o.name), (this.gender==="女"?this.name:o.name), (this.gender==="男"?this.id:o.id), (this.gender==="女"?this.id:o.id));
                this.rels[baby.id] = { score: 100, type: '子女', name: baby.name };
                o.rels[baby.id] = { score: 100, type: '子女', name: baby.name };
                villagers.push(baby);
                syncBottomBar();
            }

            findRes() {
                let t = environment.find(e => e.type !== 'grass' && Math.abs(e.x-this.x)<30 && Math.abs(e.y-this.y)<30);
                if(t) { this.hunger = Math.min(100, this.hunger + (this.str/60)); }
            }

            move(spd) {
                if(Math.random()<0.02) this.angle += (Math.random()-0.5);
                this.x += Math.cos(this.angle)*spd; this.y += Math.sin(this.angle)*spd;
                if(this.x < 15 || this.x > canvas.width-15) this.angle = Math.PI - this.angle;
                if(this.y < 50 || this.y > canvas.height-15) this.angle = -this.angle;
            }

            draw() {
                if(this.hp <= 0) { ctx.fillStyle="#333"; ctx.fillRect(this.x-5,this.y-5,10,10); return; }
                let r = (this.age < 18) ? 6 : (10 + this.siz/2.5);
                if(selectedId === this.id) { ctx.strokeStyle="#daa520"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(this.x,this.y,r+6,0,Math.PI*2); ctx.stroke(); }
                ctx.fillStyle = (this.action === "睡眠") ? "#666" : (this.gender === "男" ? "#3498db" : "#e84393");
                ctx.beginPath(); ctx.arc(this.x,this.y,r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.font = "10px Arial"; ctx.fillText(this.name, this.x-10, this.y-r-5);
            }
        }

        function syncBottomBar() {
            bottomBar.innerHTML = '';
            villagers.filter(v => v.hp > 0).forEach(v => {
                let btn = document.createElement('div');
                btn.className = `v-btn ${v.gender === "男" ? "male" : "female"} ${selectedId === v.id ? "selected" : ""}`;
                btn.innerText = v.name;
                btn.onclick = () => { selectedId = v.id; statusWindow.style.display = 'block'; syncBottomBar(); };
                bottomBar.appendChild(btn);
            });
        }

        window.castPlague = function() {
            if (plagueZone) return; // 防止重複施放
            plagueZone = {
                x: Math.random() * (canvas.width - 200) + 100,
                y: Math.random() * (canvas.height - 200) + 100,
                r: 100,
                start: Date.now()
            };
            setTimeout(() => { plagueZone = null; }, 5000); // 5秒後消失
        };

        function loop() {
            ctx.fillStyle = "#1e301e"; ctx.fillRect(0,0,canvas.width, canvas.height);
            environment.forEach(t => {
                ctx.fillStyle = (t.type === 'water' ? "#2a5a7a" : (t.type === 'forest' ? "#145a32" : "#2d4a2d"));
                ctx.fillRect(t.x, t.y, TILE_SIZE-1, TILE_SIZE-1);
            });

            // 繪製天罰毒霧
            if (plagueZone) {
                let pulse = Math.sin(Date.now() / 200) * 10;
                ctx.fillStyle = "rgba(0, 255, 0, 0.2)";
                ctx.beginPath(); ctx.arc(plagueZone.x, plagueZone.y, plagueZone.r + pulse, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "rgba(0, 255, 0, 0.5)"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(plagueZone.x, plagueZone.y, plagueZone.r + pulse + 5, 0, Math.PI*2); ctx.stroke();
                ctx.fillStyle = "#0f0"; ctx.font = "bold 14px Arial"; ctx.fillText("⚠ 瘟疫爆發", plagueZone.x - 35, plagueZone.y - plagueZone.r - 20);
            }

            totalMinutes += 0.05;
            let mins = Math.floor(totalMinutes % 60), hrs = Math.floor((totalMinutes / 60) % 24);
            let days = Math.floor((totalMinutes / (60 * 24)) % 30) + 1, mths = Math.floor((totalMinutes / (60 * 24 * 30)) % 12) + 1, yrs = Math.floor(totalMinutes / (60 * 24 * 30 * 12)) + 1;
            timeDisplay.innerText = `世界曆 第 ${yrs} 年 ${mths} 月 ${days} 日 ${hrs.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}`;

            let aliveV = villagers.filter(v => v.hp > 0);
            popStatsDisplay.innerText = `人口：${aliveV.length} (男: ${aliveV.filter(v=>v.gender==="男").length} | 女: ${aliveV.filter(v=>v.gender==="女").length})`;
            deathStatsDisplay.innerText = `累積死亡：${deathCount}`;

            villagers.forEach(v => { v.update(); v.draw(); });
            
            if(selectedId) {
                let v = villagers.find(v => v.id === selectedId);
                if(v && v.hp > 0) {
                    document.getElementById('v-name').innerText = v.name;
                    document.getElementById('v-age').innerText = Math.floor(v.age) + " 歲";
                    document.getElementById('v-personality').innerText = "性格：" + v.personality;
                    document.getElementById('v-father').innerText = v.father;
                    document.getElementById('v-mother').innerText = v.mother;
                    document.getElementById('attr-str').innerText = v.str; document.getElementById('attr-con').innerText = v.con;
                    document.getElementById('attr-siz').innerText = v.siz; document.getElementById('attr-dex').innerText = v.dex;
                    let hpPct = Math.floor(v.hp/v.maxHp*100), fdPct = Math.floor(v.hunger);
                    document.getElementById('v-health').style.width = hpPct + '%';
                    document.getElementById('v-hunger').style.width = fdPct + '%';
                    document.getElementById('hp-txt').innerText = hpPct + '%';
                    document.getElementById('fd-txt').innerText = fdPct + '%';
                    let relStrings = Object.values(v.rels).filter(r => r.type !== '陌生人').map(r => `${r.type}: ${r.name}`);
                    document.getElementById('v-social').innerText = "關係：" + (relStrings.length > 0 ? relStrings.join(', ') : '暫無');
                } else { selectedId = null; statusWindow.style.display = 'none'; syncBottomBar(); }
            }
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            let found = villagers.find(v => Math.hypot(v.x-(e.clientX-rect.left), v.y-(e.clientY-rect.top)) < 30 && v.hp > 0);
            if(found) { selectedId = found.id; statusWindow.style.display = 'block'; }
            else { selectedId = null; statusWindow.style.display = 'none'; }
            syncBottomBar();
        });

        window.castMiracle = (t) => villagers.forEach(v => { if(t==='food') v.hunger=100; else v.energy=100; });
        window.resetWorld = () => { if(confirm("確定重啟文明？")) init(); };
        init(); loop();
    };
</script>
</body>
</html>
